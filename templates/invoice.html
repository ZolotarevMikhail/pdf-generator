<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body   { font-family: "Helvetica Neue", Arial, sans-serif; color: #222; margin: 40px; }
  h1     { font-size: 22px; margin: 0 0 4px; }
  .meta  { color: #555; margin-bottom: 24px; }
  table  { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td { border: 1px solid #bbb; padding: 8px 10px; text-align: center; }
  th     { background: #f0f0f0; }
  td.name, th.name { text-align: left; }
  .total { margin-top: 16px; font-size: 16px; text-align: right; }
  .total b { font-size: 18px; }
</style>
</head>
<body>
  <h1>Счёт № {{ invoice_id }}</h1>
  <p class="meta">Дата: {{ date }} &nbsp;·&nbsp; Заказчик: {{ customer_name }}</p>

  <table>
    <tr>
      <th style="width:40px">№</th>
      <th class="name">Наименование</th>
      <th>Кол-во</th>
      <th>Цена, ₽</th>
      <th>Сумма, ₽</th>
    </tr>
    {{ items }}
  </table>

  <p class="total">Итого: <b>{{ total }} ₽</b></p>
</body>
</html>
